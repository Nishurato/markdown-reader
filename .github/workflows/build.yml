name: Cross-Platform Builds

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  APP_VERSION: '0.2.3'
  QT_VERSION: '6.8.3'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            package: .zip
          - platform: Linux-x86_64
            runner: ubuntu-22.04
            qt-host: linux
            qt-arch: linux_gcc_64
            package: .AppImage
          - platform: macOS-Intel
            runner: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
            mac-arch: x86_64
            package: .dmg
          - platform: macOS-ARM64
            runner: macos-15
            qt-host: mac
            qt-arch: clang_64
            mac-arch: arm64
            package: .dmg

    env:
      PACKAGE_NAME: MarkdownReader-0.2.3-${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build and deployment tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build patchelf desktop-file-utils squashfs-tools xauth xvfb \
            libgl1-mesa-dev libegl1-mesa-dev libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          archives: ${{ runner.os == 'Linux' && 'qtbase icu' || 'qtbase' }}
          install-deps: true
          aqtversion: '==3.3.0'

      - name: Configure and build Release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/build-windows.ps1 -QtDir $env:QT_ROOT_DIR -VisualStudioVersion '[17.0,18.0)'

      - name: Configure and build Release (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.mac-arch }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            test "$(uname -m)" = "$MAC_ARCH"
            args=(-DCMAKE_CXX_COMPILER=clang++ "-DCMAKE_OSX_ARCHITECTURES=$MAC_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          else
            test "$(uname -m)" = x86_64
            args=(-DCMAKE_CXX_COMPILER=g++)
          fi
          cmake --preset release "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" "${args[@]}"
          cmake --build --preset release

      - name: Run CTest
        working-directory: build/release
        run: ctest --output-on-failure --timeout 120 --output-junit ctest-results.xml

      - name: Save test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.platform }}
          path: |
            build/release/ctest-results.xml
            build/release/qt-test.txt
            build/release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/package-windows.ps1 -BuildDir build/release -QtDir $env:QT_ROOT_DIR -Package "build/packages/$env:PACKAGE_NAME.zip"

      - name: Deploy and verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_ARCH: ${{ matrix.mac-arch }}
        run: bash .github/scripts/package-macos.sh build/release "$QT_ROOT_DIR" "$MAC_ARCH" "build/packages/$PACKAGE_NAME.dmg"

      - name: Deploy and verify Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/package-linux.sh build/release "$QT_ROOT_DIR" "$APP_VERSION" "build/packages/$PACKAGE_NAME.AppImage"

      - name: Upload application package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: build/packages/${{ env.PACKAGE_NAME }}${{ matrix.package }}
          if-no-files-found: error
          retention-days: 14
